<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="丛鱼的个人主页：工具、常用网页导航与学期课表。" />
    <meta name="theme-color" content="#f4f1e9" />
    <title>丛鱼的家</title>
    <link rel="icon" href="./assets/shark.png" />
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <a class="skip-link" href="#main-content">跳到主要内容</a>

    <header class="site-header" id="site-header">
      <div class="nav-shell">
        <a class="brand" href="#/" aria-label="丛鱼的家首页">
          <span class="brand-mark" aria-hidden="true">
            <img src="./assets/shark.png" alt="" />
          </span>
          <span>丛鱼的家</span>
          <small>v1.0</small>
        </a>

        <nav class="main-nav" id="main-nav" aria-label="主导航">
          <a href="#/" data-route="/">首页</a>
          <a href="#/about" data-route="/about">个人简介</a>
          <a href="#/tools" data-route="/tools">工具</a>
          <a href="#/navigation" data-route="/navigation">网页导航</a>
          <a href="#/schedule" data-route="/schedule">课表</a>
        </nav>

        <div class="nav-actions">
          <button class="icon-button" id="theme-toggle" type="button" aria-label="切换深浅主题" title="切换主题">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3a9 9 0 1 0 9 9c0-.5-.04-.98-.12-1.45A7 7 0 0 1 12 3Z" /></svg>
          </button>
          <button class="menu-button" id="menu-button" type="button" aria-expanded="false" aria-controls="main-nav">
            <span></span><span></span><span></span><b>菜单</b>
          </button>
        </div>
      </div>
    </header>

    <main id="main-content" tabindex="-1">
      <div class="route-loading" aria-live="polite">正在打开丛鱼的家…</div>
    </main>

    <footer class="site-footer">
      <div class="footer-grid page-shell">
        <div class="footer-brand">
          <a class="brand" href="#/">
            <span class="brand-mark" aria-hidden="true">
              <img src="./assets/shark.png" alt="" />
            </span>
            <span>丛鱼的家</span>
          </a>
          <p>一个收纳学习、工具、网页与课表的个人空间。</p>
        </div>
        <div>
          <strong>站内</strong>
          <a href="#/about">个人简介</a>
          <a href="#/tools">工具</a>
          <a href="#/navigation">网页导航</a>
          <a href="#/schedule">课表</a>
        </div>
        <div>
          <strong>工具</strong>
          <a href="#/tools/converter">文档转换</a>
          <a href="#/tools/ocr">图片文字提取</a>
          <a href="#/tools/ai-check">AI 写作特征分析</a>
        </div>
        <div>
          <strong>说明</strong>
          <span>数据保存在静态文件中</span>
          <span>文档处理默认留在本机</span>
          <span>适配 GitHub Pages</span>
        </div>
      </div>
      <div class="footer-bottom page-shell">
        <span>congyu-home · 静态展示站</span>
        <span id="footer-year"></span>
      </div>
    </footer>

    <dialog class="course-dialog" id="course-dialog" aria-labelledby="course-dialog-title">
      <button class="dialog-close" type="button" aria-label="关闭课程详情">×</button>
      <div id="course-dialog-content"></div>
    </dialog>

    <div class="toast" id="toast" role="status" aria-live="polite"></div>

    <script src="./content/site-data.js"></script>
    <script src="./app.js"></script>
  </body>
</html>
